<style>
:root{
      --bg:#f7f3ed; --panel:#ffffff; --panel2:#f1e9df; --line:#ded3c7;
      --text:#302a26; --muted:#8a7d72; --soft:#c9a98d; --danger:#c86b67;
    }
*{box-sizing:border-box}
body{
  margin:0;color:var(--text);background:radial-gradient(circle at 20% -10%,rgba(201,169,141,.22),transparent 34%),linear-gradient(180deg,#faf7f2 0%,#f3ede5 100%);
  font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;
  min-height:100vh;
}
button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.topbar{
  position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;
  gap:16px;padding:15px clamp(16px,5vw,64px);background:rgba(222,207,192,.96);
  border-bottom:1px solid #cbb8a6;backdrop-filter:blur(14px)
}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:50%;overflow:hidden;border:2px solid #eadfd3;background:#fff;box-shadow:0 3px 10px rgba(91,70,54,.10)}.logo img{width:100%;height:100%;object-fit:cover;display:block}
.brand h1{font-size:20px;margin:0;color:#3a302a}.brand small{color:#8a7d72}
.btn{border:1px solid #bda895;background:#d2bdab;color:#493b33;padding:10px 14px;border-radius:12px}
.btn:hover{border-color:#aa927d;background:#c7ad98}
.btn.primary{background:#d8bea8;color:#4a3d35;border-color:#d8bea8;font-weight:800}
.btn.danger{color:#ff939a}
.wrap{width:min(1180px,calc(100% - 32px));margin:auto}
.hero{padding:62px 0 34px}
.eyebrow{font-size:12px;letter-spacing:.25em;color:#aaa}
.hero h2{font-size:clamp(42px,7vw,78px);line-height:1.02;margin:12px 0 16px;letter-spacing:-.05em}
.hero p{color:var(--muted);line-height:1.8}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.search{
  flex:1;min-width:220px;border:1px solid var(--line);background:#fff;color:var(--text);
  padding:11px 13px;border-radius:12px;outline:none
}
.search:focus{border-color:#666}
.tabs{display:flex;gap:8px;overflow:auto;padding:2px 0 18px}
.tab{white-space:nowrap;border:1px solid var(--line);background:#eee7de;color:#5e5148;padding:10px 14px;border-radius:999px}
.tab.active{background:#c9a98d;color:#fff;border-color:#c9a98d;font-weight:800}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:10px 0 18px}
.section-head h3{margin:0;font-size:24px}.section-head p{margin:6px 0 0;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding-bottom:60px}
.card{border:1px solid var(--line);background:linear-gradient(180deg,#141419,#0f0f13);border-radius:18px;overflow:hidden}
.card-media{aspect-ratio:1/1;background:#1c1c22;overflow:hidden}
.card-media img{width:100%;height:100%;object-fit:cover;display:block;transition:.2s}
.card:hover img{transform:scale(1.02)}
.card-body{padding:14px}
.badge{display:inline-block;font-size:11px;color:#aaa;border:1px solid #33333b;border-radius:999px;padding:4px 8px;margin-bottom:8px}
.card-title{font-size:17px;font-weight:800}.price{font-size:18px;font-weight:900;margin-top:8px}
.actions{display:flex;gap:8px;margin-top:14px}.actions button{flex:1}
.empty{padding:50px 20px;text-align:center;border:1px dashed #33333b;border-radius:18px;color:#aaa;margin-bottom:60px}
footer{border-top:1px solid #1f1f24;padding:24px 0 40px;color:#777;font-size:12px}
dialog{
  width:min(520px,calc(100% - 28px));border:1px solid #33333b;background:#121216;color:#fff;
  border-radius:18px;padding:0;box-shadow:0 28px 100px rgba(0,0,0,.65)
}
dialog::backdrop{background:rgba(0,0,0,.72);backdrop-filter:blur(6px)}
dialog form{position:relative;padding:26px;display:grid;gap:15px}
dialog h3{margin:0 0 2px;font-size:24px}dialog p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
dialog label{display:grid;gap:8px;font-size:13px;color:#ddd}
dialog input,dialog select{background:#fffaf6;color:#fff;border:1px solid #33333b;border-radius:11px;padding:11px 12px;outline:none}
dialog input:focus,dialog select:focus{border-color:#666}
.close{position:absolute;right:16px;top:14px;width:34px;height:34px;border:0;background:#1c1c22;color:#fff;border-radius:10px;font-size:20px}
.full{width:100%}
.preview{width:100%;max-height:300px;object-fit:contain;border:1px solid #2c2c33;border-radius:12px;background:#f8f3ed}
.error{min-height:16px;color:#ff7e87;font-size:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.notice{padding:11px 13px;border:1px solid #292931;background:#0f0f13;border-radius:12px;color:#aaa;font-size:12px;line-height:1.6}
.toast{
  position:fixed;right:18px;bottom:18px;z-index:99;background:#fff;color:#111;border-radius:12px;
  padding:11px 14px;font-weight:700;box-shadow:0 12px 36px rgba(0,0,0,.35);opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s
}
.toast.show{opacity:1;transform:none}
.status{font-size:12px;color:#777}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.grid{grid-template-columns:1fr}.hero{padding-top:42px}.hero h2{font-size:46px}.row{grid-template-columns:1fr}.section-head{align-items:center}}
</style>
</head>

  <form id="loginForm">
    <button type="button" class="close" data-close="loginDialog">×</button>
    <h3>管理員登入</h3>
    <p>請使用你剛才在 Firebase Authentication 建立的管理員帳號。</p>
    <label>Email<input id="loginEmail" type="email" autocomplete="username" required></label>
    <label>密碼<input id="loginPassword" type="password" autocomplete="current-password" required></label>
    <div id="loginError" class="error"></div>
    <button class="btn primary full" type="submit">登入</button>
  </form>
</dialog>

<dialog id="productDialog">
  <form id="productForm">
    <button type="button" class="close" data-close="productDialog">×</button>
    <h3 id="productDialogTitle">新增商品</h3>
    <input id="productId" type="hidden">
    <div class="row">
      <label>分類
        <select id="productCategory" required>
          <option value="新家具">新家具</option>
          <option value="家具">家具</option>
          <option value="花盆">花盆</option>
          <option value="戒指限男">戒指限男</option>
          <option value="戒指限女">戒指限女</option>
          <option value="作物限男">作物限男</option>
          <option value="作物限女">作物限女</option>
          <option value="收購區">收購區</option>
        </select>
      </label>
      <label>價格
        <input id="productPrice" placeholder="例如：80 糖" required maxlength="40">
      </label>
    </div>
    <label>名稱
      <input id="productName" placeholder="例如：黑色鹿角裝飾" required maxlength="80">
    </label>
    <label>圖片
      <input id="productImage" type="file" accept="image/*">
    </label>
    <img id="preview" class="preview hidden" alt="預覽">
    <div class="notice">圖片會在上架前自動縮小壓縮，再和商品資料一起存到 Firestore。建議原圖不要太誇張大張。</div>
    <div id="productError" class="error"></div>
    <button id="saveProductBtn" class="btn primary full" type="submit">儲存商品</button>
  </form>
</dialog>

<div id="toast" class="toast">已儲存</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import {
  getFirestore, collection, addDoc, updateDoc, deleteDoc, doc,
  onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAHhPD_c7mJbzQKF1YnrySpBSLLs-IecAw",
  authDomain: "nene-sell.firebaseapp.com",
  projectId: "nene-sell",
  storageBucket: "nene-sell.firebasestorage.app",
  messagingSenderId: "612122074185",
  appId: "1:612122074185:web:9eb29bd13ff79eec6e7398"
};

const ADMIN_UID = "m6CfH9lsrmbG4Mw8SzgmlZL8R2i1";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

let products = [];
let activeCategory = "新家具";
let currentUser = null;
let editingImage = "";

function isAdmin(){
  return currentUser && currentUser.uid === ADMIN_UID;
}

function toast(msg){
  const t=$("#toast");
  t.textContent=msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),1400);
}

function esc(s=""){
  return String(s)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

function render(){
  const q=$("#searchInput").value.trim().toLowerCase();
  let list = products.filter(p => activeCategory==="全部" || p.category===activeCategory);
  if(q){
    list = list.filter(p =>
      String(p.name||"").toLowerCase().includes(q) ||
      String(p.price||"").toLowerCase().includes(q)
    );
  }

  $("#productCount").textContent=`${list.length} 件商品`;
  $("#sectionTitle").textContent=activeCategory==="全部"?"全部商品":activeCategory;
  $("#grid").innerHTML="";
  $("#empty").classList.toggle("hidden", list.length!==0);

  list.forEach(p=>{
    const card=document.createElement("article");
    card.className="card";
    card.innerHTML=`
      <div class="card-media"><img src="${p.imageData || ""}" alt="${esc(p.name)}"></div>
      <div class="card-body">
        <span class="badge">${esc(p.category)}</span>
        <div class="card-title">${esc(p.name)}</div>
        <div class="price">${esc(p.price)}</div>
        ${isAdmin()?`<div class="actions"><button class="btn edit">編輯</button><button class="btn danger delete">刪除</button></div>`:""}
      </div>`;
    if(isAdmin()){
      card.querySelector(".edit").onclick=()=>openProduct(p);
      card.querySelector(".delete").onclick=()=>deleteProduct(p);
    }
    $("#grid").appendChild(card);
  });

  $("#addBtn").classList.toggle("hidden", !isAdmin());
  $("#adminBtn").textContent=isAdmin() ? "管理員登出" : "管理員登入";
}

async function compressImage(file){
  const dataUrl = await new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });

  const img = await new Promise((resolve,reject)=>{
    const i=new Image();
    i.onload=()=>resolve(i);
    i.onerror=reject;
    i.src=dataUrl;
  });

  const maxSide = 900;
  const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
  const w = Math.max(1, Math.round(img.width * scale));
  const h = Math.max(1, Math.round(img.height * scale));

  const canvas=document.createElement("canvas");
  canvas.width=w; canvas.height=h;
  const ctx=canvas.getContext("2d");
  ctx.drawImage(img,0,0,w,h);

  let quality=0.78;
  let out=canvas.toDataURL("image/jpeg",quality);

  // Firestore document max size is 1 MiB. Keep image comfortably below that.
  while(out.length > 650000 && quality > 0.38){
    quality -= 0.08;
    out=canvas.toDataURL("image/jpeg",quality);
  }

  if(out.length > 780000){
    throw new Error("這張圖片壓縮後還是太大，請換小一點的圖片。");
  }
  return out;
}

function openProduct(p=null){
  $("#productDialogTitle").textContent=p?"編輯商品":"新增商品";
  $("#productId").value=p?.id||"";
  $("#productCategory").value=p?.category||"家具";
  $("#productName").value=p?.name||"";
  $("#productPrice").value=p?.price||"";
  $("#productImage").value="";
  editingImage=p?.imageData||"";
  $("#productError").textContent="";
  if(editingImage){
    $("#preview").src=editingImage;
    $("#preview").classList.remove("hidden");
  }else{
    $("#preview").src="";
    $("#preview").classList.add("hidden");
  }
  $("#productDialog").showModal();
}

$("#productImage").addEventListener("change", async e=>{
  const file=e.target.files[0];
  if(!file)return;
  $("#productError").textContent="圖片處理中…";
  try{
    editingImage=await compressImage(file);
    $("#preview").src=editingImage;
    $("#preview").classList.remove("hidden");
    $("#productError").textContent="";
  }catch(err){
    editingImage="";
    $("#preview").classList.add("hidden");
    $("#productError").textContent=err.message||"圖片處理失敗";
  }
});

$("#productForm").addEventListener("submit", async e=>{
  e.preventDefault();
  if(!isAdmin()){
    $("#productError").textContent="管理員尚未登入";
    return;
  }
  if(!editingImage){
    $("#productError").textContent="請選擇商品圖片";
    return;
  }

  const saveBtn=$("#saveProductBtn");
  saveBtn.disabled=true;
  saveBtn.textContent="儲存中…";
  $("#productError").textContent="";

  try{
    const id=$("#productId").value;
    const payload={
      category:$("#productCategory").value,
      name:$("#productName").value.trim(),
      price:$("#productPrice").value.trim(),
      imageData:editingImage,
      updatedAt:serverTimestamp()
    };

    if(id){
      await updateDoc(doc(db,"products",id),payload);
    }else{
      await addDoc(collection(db,"products"),{
        ...payload,
        createdAt:serverTimestamp()
      });
    }

    $("#productDialog").close();
    $("#productForm").reset();
    editingImage="";
    toast("商品已儲存");
  }catch(err){
    console.error(err);
    $("#productError").textContent=err.message||"商品儲存失敗";
  }finally{
    saveBtn.disabled=false;
    saveBtn.textContent="儲存商品";
  }
});

async function deleteProduct(p){
  if(!isAdmin())return;
  if(!confirm(`確定刪除「${p.name}」？`))return;
  try{
    await deleteDoc(doc(db,"products",p.id));
    toast("商品已刪除");
  }catch(err){
    alert(err.message||"刪除失敗");
  }
}

$("#loginForm").addEventListener("submit", async e=>{
  e.preventDefault();
  $("#loginError").textContent="";
  try{
    const cred=await signInWithEmailAndPassword(
      auth,
      $("#loginEmail").value.trim(),
      $("#loginPassword").value
    );
    if(cred.user.uid !== ADMIN_UID){
      await signOut(auth);
      throw new Error("這個帳號不是管理員");
    }
    $("#loginDialog").close();
    $("#loginForm").reset();
    toast("管理員已登入");
  }catch(err){
    console.error(err);
    $("#loginError").textContent="登入失敗，請確認 Email 和密碼。";
  }
});

$("#adminBtn").onclick=async()=>{
  if(isAdmin()){
    await signOut(auth);
    toast("已登出");
  }else{
    $("#loginError").textContent="";
    $("#loginDialog").showModal();
  }
};

onAuthStateChanged(auth,user=>{
  currentUser = user && user.uid===ADMIN_UID ? user : null;
  render();
});

$("#addBtn").onclick=()=>openProduct();
$("#searchInput").oninput=render;
$$(".tab").forEach(btn=>btn.onclick=()=>{
  activeCategory=btn.dataset.category;
  $$(".tab").forEach(x=>x.classList.toggle("active",x===btn));
  render();
});
$$("[data-close]").forEach(btn=>btn.onclick=()=>document.getElementById(btn.dataset.close).close());

onSnapshot(
  collection(db,"products"),
  snap=>{
    products=snap.docs.map(d=>({id:d.id,...d.data()}));
    products.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
    $("#status").textContent="已連線";
    render();
  },
  err=>{
    console.error(err);
    $("#status").textContent="資料讀取失敗";
  }
);
</script>
</body>
</html>
